<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cricket Scorecard Controller & Overlay</title>
  <style>
    :root {
      --bg-panel: #111827;
      --text-main: #ffffff;
      --accent-yellow: #facc15;
      --btn-blue: #2563eb;
      --btn-green: #16a34a;
      --btn-purple: #9333ea;
      --btn-red: #dc2626;
      --btn-gray: #4b5563;
      --four-color: #4ade80;
      --six-color: #a78bfa;
      --wicket-color: #f87171;
    }

    body {
      margin: 0;
      padding: 15px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0b0f19;
      color: var(--text-main);
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .admin-panel {
      padding: 20px;
      background: var(--bg-panel);
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .admin-panel h2 { margin-top: 0; text-align: center; color: var(--accent-yellow); }
    .section-title { font-size: 13px; color: #9ca3af; margin: 15px 0 6px 0; text-transform: uppercase; letter-spacing: 1px; }

    .input-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    input, select {
      padding: 10px; border-radius: 6px; border: 1px solid #374151;
      background: #1f2937; color: #fff; font-size: 14px; width: 100%; box-sizing: border-box;
    }

    .grid-buttons, .manual-controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }

    button {
      padding: 12px; font-size: 15px; font-weight: bold; border: none;
      border-radius: 8px; cursor: pointer; color: #fff; background: var(--btn-blue);
      transition: transform 0.1s;
    }
    button:active { transform: scale(0.95); }

    .btn-dot { background: var(--btn-gray); }
    .btn-four { background: var(--btn-green); }
    .btn-six { background: var(--btn-purple); }
    .btn-wicket { background: var(--btn-red); }
    .btn-extra { background: #d97706; }
    .btn-strike { background: #0284c7; grid-column: span 3; }
    .btn-manual { background: #374151; border: 1px solid #4b5563; }

    .scorebar-container {
      background: rgba(15, 23, 42, 0.95);
      border-left: 5px solid var(--accent-yellow);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      padding: 12px 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.8);
      transition: border-color 0.3s, background-color 0.3s;
    }

    .main-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 6px;
    }

    .sub-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding-top: 6px;
      font-size: 14px;
      color: #d1d5db;
    }

    .target-row {
      background: rgba(234, 179, 8, 0.15);
      border-top: 1px solid rgba(250, 204, 21, 0.3);
      margin-top: 8px;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: bold;
      color: var(--accent-yellow);
      display: flex;
      justify-content: space-between;
    }

    .team-info { font-size: 20px; font-weight: 800; color: var(--accent-yellow); }
    .score-info { font-size: 28px; font-weight: 900; }
    .overs-info { font-size: 18px; color: #9ca3af; font-weight: 600; }
    .player-highlight { color: var(--accent-yellow); font-weight: bold; }
    
    .over-tracker {
      font-size: 13px;
      color: #38bdf8;
      font-weight: bold;
      margin-top: 2px;
      letter-spacing: 1px;
    }

    @keyframes pulse-animation {
      0% { transform: scale(1); }
      50% { transform: scale(1.03); }
      100% { transform: scale(1); }
    }

    .scorebar-container.animate-four {
      animation: pulse-animation 0.5s ease-in-out;
      border-left-color: var(--four-color);
      background-color: rgba(22, 163, 74, 0.9);
    }

    .scorebar-container.animate-six {
      animation: pulse-animation 0.5s ease-in-out;
      border-left-color: var(--six-color);
      background-color: rgba(147, 51, 234, 0.9);
    }

    .scorebar-container.animate-wicket {
      animation: pulse-animation 0.6s ease-in-out;
      border-left-color: var(--wicket-color);
      background-color: rgba(220, 38, 38, 0.95);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="admin-panel">
      <h2>🏏 Cricket Scorecard Controller</h2>

      <div class="section-title">⚙️ Match Settings & Target</div>
      <div class="input-grid" style="margin-bottom: 10px;">
        <div>
          <label style="font-size: 12px; color: #9ca3af;">Total Overs</label>
          <input type="number" id="in-max-overs" placeholder="Total Overs" value="20" oninput="sync()">
        </div>
        <div>
          <label style="font-size: 12px; color: #9ca3af;">Innings</label>
          <select id="in-innings" onchange="sync()">
            <option value="1">1st Innings</option>
            <option value="2">2nd Innings (Chasing)</option>
          </select>
        </div>
        <div style="grid-column: span 2;">
          <label style="font-size: 12px; color: #9ca3af;">Target Runs (2nd Innings)</label>
          <input type="number" id="in-target" placeholder="Target Score (e.g. 150)" value="0" oninput="sync()">
        </div>
      </div>

      <div class="section-title">📝 Teams & Players</div>
      <div class="input-grid">
        <input type="text" id="in-team-a" placeholder="Batting Team" value="TEAM A" oninput="sync()">
        <input type="text" id="in-team-b" placeholder="Bowling Team" value="TEAM B" oninput="sync()">
        <input type="text" id="in-striker" placeholder="Striker Name" value="Striker" oninput="sync()">
        <input type="text" id="in-non-striker" placeholder="Non-Striker Name" value="Non-Striker" oninput="sync()">
        <input type="text" id="in-bowler" placeholder="Current Bowler" value="Bowler Name" onchange="onBowlerChange()" style="grid-column: span 2;">
      </div>
      
      <div class="section-title">⚡ Quick Actions</div>
      <div class="grid-buttons">
        <button class="btn-dot" onclick="addBall(0, '0')">0 (Dot Ball)</button>
        <button onclick="addBall(1, '1')">+1 Run</button>
        <button onclick="addBall(2, '2')">+2 Runs</button>
        <button onclick="addBall(3, '3')">+3 Runs</button>
        <button class="btn-four" onclick="triggerAnim('four'); addBall(4, '4');">4️⃣ FOUR</button>
        <button class="btn-six" onclick="triggerAnim('six'); addBall(6, '6');">6️⃣ SIX</button>
        <button class="btn-wicket" onclick="addWicket()">☝️ WICKET</button>
        <button class="btn-extra" onclick="addExtra('wide', 'WD')">Wide (+1)</button>
        <button class="btn-extra" onclick="addExtra('noball', 'NB')">No Ball (+1)</button>
        <button class="btn-strike" onclick="swapStrike()">🔄 Rotate Strike Manually</button>
      </div>

      <div class="section-title">🛠️ Manual Score Adjustments</div>
      <div class="manual-controls">
        <button class="btn-manual" onclick="manualAdjust('runs', 1)">+1 Team Run</button>
        <button class="btn-manual" onclick="manualAdjust('runs', -1)">-1 Team Run</button>
        <button class="btn-manual" onclick="manualAdjust('balls', 1)">+1 Ball</button>
        <button class="btn-manual" onclick="manualAdjust('balls', -1)">-1 Ball</button>
        <button class="btn-manual" onclick="manualAdjust('wickets', 1)">+1 Wicket</button>
        <button class="btn-manual" onclick="manualAdjust('wickets', -1)">-1 Wicket</button>
      </div>
    </div>

    <!-- Live Preview -->
    <div class="scorebar-container" id="scorebar">
      <div class="main-row">
        <div class="team-info"><span id="out-team-a">TEAM A</span> vs <span id="out-team-b">TEAM B</span></div>
        <div class="score-info">
          <span id="runs">0</span>/<span id="wickets">0</span>
        </div>
        <div class="overs-info">
          OVERS: <span id="overs">0.0</span> / <span id="out-max-overs">20</span>
        </div>
      </div>
      <div class="sub-row">
        <div>
          BAT: <span class="player-highlight" id="out-striker">Striker* 0 (0)</span> | 
          <span id="out-non-striker">Non-Striker 0 (0)</span>
        </div>
        <div style="text-align: right;">
          BOWL: <span class="player-highlight" id="out-bowler">Bowler Name 0-0 (0.0)</span>
          <div class="over-tracker" id="out-this-over">THIS OVER: [ - ]</div>
        </div>
      </div>
      <div class="target-row" id="target-banner" style="display: none;">
        <span>TARGET: <span id="out-target">0</span></span>
        <span id="out-need">NEED 0 OFF 0 BALLS</span>
        <span>RRR: <span id="out-rrr">0.00</span></span>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script>
    const firebaseConfig = {
      databaseURL: "https://betterone48-207a0-default-rtdb.asia-southeast1.firebasedatabase.app"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database().ref('matchState');
    const scorebar = document.getElementById('scorebar');

    let runs = 0, wickets = 0, legalBalls = 0;
    let strikerRuns = 0, strikerBalls = 0;
    let nonStrikerRuns = 0, nonStrikerBalls = 0;
    
    let bowlerRuns = 0, bowlerWickets = 0, bowlerBalls = 0;
    let currentOverBalls = [];

    function sync(animType = "") {
      const overNum = Math.floor(legalBalls / 6);
      const ballNum = legalBalls % 6;

      const bowlerOverNum = Math.floor(bowlerBalls / 6);
      const bowlerBallNum = bowlerBalls % 6;

      const maxOvers = parseInt(document.getElementById('in-max-overs').value) || 20;
      const innings = document.getElementById('in-innings').value;
      const target = parseInt(document.getElementById('in-target').value) || 0;

      const totalBallsInMatch = maxOvers * 6;
      const remainingBalls = Math.max(0, totalBallsInMatch - legalBalls);
      const needRuns = Math.max(0, target - runs);
      const rrr = remainingBalls > 0 ? ((needRuns / remainingBalls) * 6).toFixed(2) : "0.00";

      db.set({
        teamA: document.getElementById('in-team-a').value || 'TEAM A',
        teamB: document.getElementById('in-team-b').value || 'TEAM B',
        strikerName: document.getElementById('in-striker').value || 'Striker',
        strikerRuns: strikerRuns,
        strikerBalls: strikerBalls,
        nonStrikerName: document.getElementById('in-non-striker').value || 'Non-Striker',
        nonStrikerRuns: nonStrikerRuns,
        nonStrikerBalls: nonStrikerBalls,
        bowler: document.getElementById('in-bowler').value || 'Bowler Name',
        bowlerRuns: bowlerRuns,
        bowlerWickets: bowlerWickets,
        bowlerOvers: `${bowlerOverNum}.${bowlerBallNum}`,
        thisOver: currentOverBalls.length > 0 ? currentOverBalls.join(' | ') : '-',
        runs: runs,
        wickets: wickets,
        overs: `${overNum}.${ballNum}`,
        maxOvers: maxOvers,
        innings: innings,
        target: target,
        needRuns: needRuns,
        remainingBalls: remainingBalls,
        rrr: rrr,
        anim: animType,
        timestamp: Date.now()
      });
    }

    function triggerAnim(type) { sync(type); }

    function onBowlerChange() {
      bowlerRuns = 0;
      bowlerWickets = 0;
      bowlerBalls = 0;
      currentOverBalls = [];
      sync();
    }

    function swapStrike() {
      const sName = document.getElementById('in-striker').value;
      const nsName = document.getElementById('in-non-striker').value;
      document.getElementById('in-striker').value = nsName;
      document.getElementById('in-non-striker').value = sName;

      const tempR = strikerRuns;
      const tempB = strikerBalls;
      strikerRuns = nonStrikerRuns;
      strikerBalls = nonStrikerBalls;
      nonStrikerRuns = tempR;
      nonStrikerBalls = tempB;
    }

    function addBall(r, label) {
      runs += r;
      legalBalls++;
      strikerRuns += r;
      strikerBalls++;

      bowlerRuns += r;
      bowlerBalls++;
      currentOverBalls.push(label);

      if (r % 2 !== 0) swapStrike();
      if (legalBalls % 6 === 0) {
        swapStrike();
        setTimeout(() => { currentOverBalls = []; sync(); }, 1500);
      }

      sync();
    }

    function addWicket() {
      if (wickets < 10) {
        wickets++;
        legalBalls++;
        strikerBalls++;
        bowlerWickets++;
        bowlerBalls++;
        currentOverBalls.push('W');

        strikerRuns = 0;
        strikerBalls = 0;
        document.getElementById('in-striker').value = "New Batsman";

        if (legalBalls % 6 === 0) {
          swapStrike();
          setTimeout(() => { currentOverBalls = []; sync(); }, 1500);
        }

        sync('wicket');
      }
    }

    function addExtra(type, label) {
      runs += 1;
      bowlerRuns += 1;
      currentOverBalls.push(label);
      sync();
    }

    function manualAdjust(type, amount) {
      if (type === 'runs') runs = Math.max(0, runs + amount);
      if (type === 'wickets') wickets = Math.min(10, Math.max(0, wickets + amount));
      if (type === 'balls') legalBalls = Math.max(0, legalBalls + amount);
      sync();
    }

    db.on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        document.getElementById('out-team-a').innerText = data.teamA || 'TEAM A';
        document.getElementById('out-team-b').innerText = data.teamB || 'TEAM B';
        
        document.getElementById('out-striker').innerText = `${data.strikerName || 'Striker'}* ${data.strikerRuns || 0} (${data.strikerBalls || 0})`;
        document.getElementById('out-non-striker').innerText = `${data.nonStrikerName || 'Non-Striker'} ${data.nonStrikerRuns || 0} (${data.nonStrikerBalls || 0})`;
        
        document.getElementById('out-bowler').innerText = `${data.bowler || 'Bowler'} ${data.bowlerWickets || 0}-${data.bowlerRuns || 0} (${data.bowlerOvers || '0.0'})`;
        document.getElementById('out-this-over').innerText = `THIS OVER: [ ${data.thisOver || '-'} ]`;

        document.getElementById('runs').innerText = data.runs || 0;
        document.getElementById('wickets').innerText = data.wickets || 0;
        document.getElementById('overs').innerText = data.overs || "0.0";
        document.getElementById('out-max-overs').innerText = data.maxOvers || 20;

        const targetBanner = document.getElementById('target-banner');
        if (data.innings === "2") {
          targetBanner.style.display = 'flex';
          document.getElementById('out-target').innerText = data.target || 0;
          document.getElementById('out-need').innerText = `NEED ${data.needRuns || 0} OFF ${data.remainingBalls || 0} BALLS`;
          document.getElementById('out-rrr').innerText = data.rrr || "0.00";
        } else {
          targetBanner.style.display = 'none';
        }

        if (data.anim) {
          const animClass = `animate-${data.anim}`;
          scorebar.classList.add(animClass);
          setTimeout(() => { scorebar.classList.remove(animClass); }, 600);
        }
      }
    });

    sync();
  </script>
</body>
</html>
