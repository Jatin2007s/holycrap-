<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cricket Scorecard Overlay</title>

  <!-- Firebase Compatibility SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #ffffff;
    }

    .scorecard-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 90%;
      max-width: 900px;
      margin: 20px auto;
      background: rgba(15, 23, 42, 0.9);
      border-radius: 12px;
      padding: 15px 25px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .team-info {
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .score-display {
      font-size: 32px;
      font-weight: 800;
      color: #38bdf8;
    }

    .overs-display {
      font-size: 20px;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <div class="scorecard-banner">
    <div class="team-info" id="battingTeam">TEAM A</div>
    <div class="score-display">
      <span id="runs">0</span> / <span id="wickets">0</span>
    </div>
    <div class="overs-display">
      Overs: <span id="overs">0.0</span>
    </div>
  </div>

  <script>
    // 1. Firebase Configuration (Replace with your exact Firebase config values)
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "betterone48-207a0.firebaseapp.com",
      databaseURL: "https://betterone48-207a0-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "betterone48-207a0",
      storageBucket: "betterone48-207a0.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    // Initialize Firebase
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    // 2. Extract match ID from URL parameter (e.g., overlay.html?match=match_1)
    const urlParams = new URLSearchParams(window.location.search);
    const matchId = urlParams.get('match') || 'match_1';

    // 3. Listen to real-time changes for the specific match
    const matchRef = firebase.database().ref('matches/' + matchId);

    matchRef.on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        document.getElementById('battingTeam').innerText = data.battingTeam || "TEAM A";
        document.getElementById('runs').innerText = data.runs !== undefined ? data.runs : 0;
        document.getElementById('wickets').innerText = data.wickets !== undefined ? data.wickets : 0;
        document.getElementById('overs').innerText = data.overs !== undefined ? data.overs : "0.0";
      }
    });
  </script>
</body>
</html>
