<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cricket Overlay Stream</title>
  <style>
    :root {
      --accent-yellow: #facc15;
      --four-color: #22c55e;
      --six-color: #a855f7;
      --wicket-color: #ef4444;
    }

    body {
      margin: 0;
      padding: 0;
      background: transparent;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #ffffff;
      overflow: hidden;
    }

    .overlay-wrapper {
      position: relative;
      width: 100%;
      max-width: 850px;
    }

    .scorebar-container {
      background: rgba(15, 23, 42, 0.95);
      border-left: 6px solid var(--accent-yellow);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      padding: 12px 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.8);
      width: 100%;
      box-sizing: border-box;
    }

    .main-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.15);
      padding-bottom: 6px;
    }

    .sub-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding-top: 6px;
      font-size: 14px;
      color: #d1d5db;
    }

    .target-row {
      background: rgba(234, 179, 8, 0.18);
      border-top: 1px solid rgba(250, 204, 21, 0.3);
      margin-top: 8px;
      padding: 5px 12px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: bold;
      color: var(--accent-yellow);
      display: flex;
      justify-content: space-between;
    }

    .winner-banner {
      background: linear-gradient(135deg, #16a34a, #15803d);
      color: #ffffff;
      text-align: center;
      padding: 10px;
      border-radius: 6px;
      margin-top: 8px;
      font-weight: 900;
      font-size: 16px;
      box-shadow: 0 4px 15px rgba(22, 163, 74, 0.5);
      letter-spacing: 1px;
    }

    .team-info { font-size: 20px; font-weight: 800; color: var(--accent-yellow); }
    .score-info { font-size: 28px; font-weight: 900; }
    .overs-info { font-size: 18px; color: #9ca3af; font-weight: 600; }
    .player-highlight { color: var(--accent-yellow); font-weight: bold; }
    
    .over-tracker {
      font-size: 13px;
      color: #38bdf8;
      font-weight: bold;
      margin-top: 2px;
      letter-spacing: 1px;
    }

    /* Boundary / Wicket Pop-up Banner */
    .popup-badge {
      position: absolute;
      top: -15px;
      right: 20px;
      padding: 8px 24px;
      border-radius: 30px;
      font-size: 22px;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
      transform: scale(0);
      opacity: 0;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s;
      z-index: 10;
    }

    .popup-badge.show {
      transform: scale(1);
      opacity: 1;
    }

    .popup-badge.FOUR {
      background: linear-gradient(135deg, #22c55e, #15803d);
      border: 2px solid #86efac;
    }

    .popup-badge.SIX {
      background: linear-gradient(135deg, #a855f7, #7e22ce);
      border: 2px solid #d8b4fe;
    }

    .popup-badge.WICKET {
      background: linear-gradient(135deg, #ef4444, #b91c1c);
      border: 2px solid #fca5a5;
    }
  </style>
</head>
<body>

  <div class="overlay-wrapper">
    <!-- Pop-up Badge for 4s, 6s, and Wickets -->
    <div id="popup-badge" class="popup-badge">FOUR!</div>

    <div class="scorebar-container" id="scorebar">
      <div class="main-row">
        <div class="team-info"><span id="out-team-a">TEAM A</span> vs <span id="out-team-b">TEAM B</span></div>
        <div class="score-info">
          <span id="runs">0</span>/<span id="wickets">0</span>
        </div>
        <div class="overs-info">
          OVERS: <span id="overs">0.0</span> / <span id="out-max-overs">20</span>
        </div>
      </div>
      <div class="sub-row">
        <div>
          BAT: <span class="player-highlight" id="out-striker">Striker* 0 (0)</span> | 
          <span id="out-non-striker">Non-Striker 0 (0)</span>
        </div>
        <div style="text-align: right;">
          BOWL: <span class="player-highlight" id="out-bowler">Bowler Name 0-0 (0.0)</span>
          <div class="over-tracker" id="out-this-over">THIS OVER: [ - ]</div>
        </div>
      </div>
      <div class="target-row" id="target-banner" style="display: none;">
        <span>TARGET: <span id="out-target">0</span></span>
        <span id="out-need">NEED 0 OFF 0 BALLS</span>
        <span>RRR: <span id="out-rrr">0.00</span></span>
      </div>
      <div class="winner-banner" id="status-banner" style="display: none;">🏆 MATCH FINISHED</div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script>
    const firebaseConfig = {
      databaseURL: "https://betterone48-207a0-default-rtdb.asia-southeast1.firebasedatabase.app"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database().ref('matchState');

    let lastAnimId = null;
    let animTimeout = null;

    function showPopup(type) {
      const badge = document.getElementById('popup-badge');
      badge.className = `popup-badge ${type} show`;

      if (type === 'FOUR') badge.innerText = '4️⃣ FOUR!';
      else if (type === 'SIX') badge.innerText = '6️⃣ SIX!';
      else if (type === 'WICKET') badge.innerText = '☝️ WICKET!';

      clearTimeout(animTimeout);
      animTimeout = setTimeout(() => {
        badge.classList.remove('show');
      }, 2500);
    }

    db.on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        document.getElementById('out-team-a').innerText = data.teamA || 'TEAM A';
        document.getElementById('out-team-b').innerText = data.teamB || 'TEAM B';
        
        document.getElementById('out-striker').innerText = `${data.strikerName || 'Striker'}* ${data.strikerRuns || 0} (${data.strikerBalls || 0})`;
        document.getElementById('out-non-striker').innerText = `${data.nonStrikerName || 'Non-Striker'} ${data.nonStrikerRuns || 0} (${data.nonStrikerBalls || 0})`;
        
        document.getElementById('out-bowler').innerText = `${data.bowler || 'Bowler'} ${data.bowlerWickets || 0}-${data.bowlerRuns || 0} (${data.bowlerOvers || '0.0'})`;
        document.getElementById('out-this-over').innerText = `THIS OVER: [ ${data.thisOver || '-'} ]`;

        document.getElementById('runs').innerText = data.runs || 0;
        document.getElementById('wickets').innerText = data.wickets || 0;
        document.getElementById('overs').innerText = data.overs || "0.0";
        document.getElementById('out-max-overs').innerText = data.maxOvers || 20;

        const targetBanner = document.getElementById('target-banner');
        if (data.innings === "2") {
          targetBanner.style.display = 'flex';
          document.getElementById('out-target').innerText = data.target || 0;
          document.getElementById('out-need').innerText = `NEED ${data.needRuns || 0} OFF ${data.remainingBalls || 0} BALLS`;
          document.getElementById('out-rrr').innerText = data.rrr || "0.00";
        } else {
          targetBanner.style.display = 'none';
        }

        const statusBanner = document.getElementById('status-banner');
        if (data.matchStatusText && data.matchStatusText !== "") {
          statusBanner.innerText = data.matchStatusText;
          statusBanner.style.display = 'block';
        } else {
          statusBanner.style.display = 'none';
        }

        if (data.anim && data.animId !== lastAnimId) {
          lastAnimId = data.animId;
          showPopup(data.anim);
        }
      }
    });
  </script>
</body>
</html>
