<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cricket Stream Graphics Overlay</title>
  <link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;700&family=Montserrat:wght@600;800&display=swap" rel="stylesheet" />
  
  <style>
    /* ==========================================
       1. GLOBAL & CONTAINER STYLES
       ========================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Teko', sans-serif;
    }

    body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: transparent; /* Clear background for OBS / Broadcast software */
      position: relative;
      color: #ffffff;
      text-transform: uppercase;
    }

    /* ==========================================
       2. BOTTOM MAIN SCOREBAR
       ========================================== */
    #scorebar {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%) translateY(150px);
      display: flex;
      align-items: center;
      background: rgba(10, 15, 29, 0.92);
      border-radius: 12px;
      border: 2px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), 0 0 20px rgba(0, 168, 255, 0.2);
      height: 70px;
      padding: 0 20px;
      transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 100;
    }

    #scorebar.active {
      transform: translateX(-50%) translateY(0);
    }

    .team-badge {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 38px;
      font-weight: 700;
      letter-spacing: 1px;
      padding-right: 20px;
      border-right: 2px solid rgba(255, 255, 255, 0.1);
    }

    .team-flag {
      width: 40px;
      height: 28px;
      border-radius: 4px;
      object-fit: cover;
      background: #222;
    }

    .main-score {
      font-size: 52px;
      font-weight: 700;
      color: #00e5ff;
      padding: 0 20px;
      text-shadow: 0 0 10px rgba(0, 229, 255, 0.5);
    }

    .overs-tag {
      font-size: 28px;
      color: #a0aec0;
      padding-right: 20px;
      border-right: 2px solid rgba(255, 255, 255, 0.1);
    }

    .batsmen-section {
      display: flex;
      gap: 25px;
      padding: 0 20px;
      font-family: 'Montserrat', sans-serif;
      font-size: 16px;
    }

    .batsman {
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0.7;
    }

    .batsman.striker {
      opacity: 1;
      color: #ffea00;
    }

    .batsman.striker::after {
      content: '*';
      color: #ffea00;
    }

    .bowler-section {
      padding-left: 20px;
      border-left: 2px solid rgba(255, 255, 255, 0.1);
      font-family: 'Montserrat', sans-serif;
      font-size: 16px;
      color: #e2e8f0;
    }

    /* ==========================================
       3. CENTER POPUP ANNOUNCEMENT OVERLAY
       ========================================== */
    #announcement-overlay {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      opacity: 0;
      text-align: center;
      z-index: 500;
      pointer-events: none;
      transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    }

    #announcement-overlay.show {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
    }

    .announcement-box {
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      border: 4px solid #00e5ff;
      padding: 20px 60px;
      border-radius: 20px;
      box-shadow: 0 0 50px rgba(0, 229, 255, 0.6), inset 0 0 20px rgba(0, 229, 255, 0.4);
    }

    .announcement-title {
      font-size: 110px;
      font-weight: 700;
      line-height: 0.9;
      background: linear-gradient(180deg, #ffffff 0%, #00e5ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 5px 15px rgba(0,0,0,0.8));
    }

    .announcement-subtitle {
      font-family: 'Montserrat', sans-serif;
      font-size: 24px;
      letter-spacing: 4px;
      color: #ffea00;
      margin-top: 10px;
    }

    /* Wicket theme styling override */
    #announcement-overlay.wicket .announcement-box {
      border-color: #ff1744;
      box-shadow: 0 0 50px rgba(255, 23, 68, 0.6), inset 0 0 20px rgba(255, 23, 68, 0.4);
    }
    #announcement-overlay.wicket .announcement-title {
      background: linear-gradient(180deg, #ffffff 0%, #ff1744 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* ==========================================
       4. FULL SCREEN SCORECARD OVERLAY
       ========================================== */
    #full-scorecard {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.9);
      width: 1200px;
      background: rgba(15, 23, 42, 0.96);
      border: 2px solid rgba(0, 229, 255, 0.3);
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
      opacity: 0;
      visibility: hidden;
      transition: all 0.5s ease;
      z-index: 400;
    }

    #full-scorecard.active {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, -50%) scale(1);
    }

    .scorecard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 15px;
      margin-bottom: 20px;
    }

    .scorecard-title {
      font-size: 48px;
      color: #00e5ff;
    }

    .scorecard-table {
      width: 100%;
      border-collapse: collapse;
      font-family: 'Montserrat', sans-serif;
      font-size: 18px;
    }

    .scorecard-table th {
      text-align: left;
      padding: 12px;
      background: rgba(255, 255, 255, 0.05);
      color: #a0aec0;
    }

    .scorecard-table td {
      padding: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    /* Pulse animation utility */
    .pulse-anim {
      animation: pulse 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>

  <!-- ==========================================
       BOTTOM SCOREBAR GRAPHIC
       ========================================== -->
  <div id="scorebar" class="active">
    <div class="team-badge">
      <div id="team-name">IND</div>
    </div>
    
    <div class="main-score">
      <span id="runs">0</span>/<span id="wickets">0</span>
    </div>
    
    <div class="overs-tag">
      OVERS <span id="overs">0.0</span>
    </div>

    <div class="batsmen-section">
      <div class="batsman striker" id="batsman1-container">
        <span id="batsman1-name">BATSMAN 1</span>
        <span id="batsman1-runs">0</span>(<span id="batsman1-balls">0</span>)
      </div>
      <div class="batsman" id="batsman2-container">
        <span id="batsman2-name">BATSMAN 2</span>
        <span id="batsman2-runs">0</span>(<span id="batsman2-balls">0</span>)
      </div>
    </div>

    <div class="bowler-section">
      BOWLING: <span id="bowler-name">BOWLER</span> 
      <span id="bowler-wickets">0</span>/<span id="bowler-runs">0</span> 
      (<span id="bowler-overs">0.0</span>)
    </div>
  </div>

  <!-- ==========================================
       CENTER ANNOUNCEMENT POPUP
       ========================================== -->
  <div id="announcement-overlay">
    <div class="announcement-box">
      <div class="announcement-title" id="announcement-title">SIX!</div>
      <div class="announcement-subtitle" id="announcement-subtitle">WHAT A HUGE HIT!</div>
    </div>
  </div>

  <!-- ==========================================
       FULL-SCREEN SCORECARD OVERLAY
       ========================================== -->
  <div id="full-scorecard">
    <div class="scorecard-header">
      <div class="scorecard-title" id="sc-team-title">INDIA INNINGS</div>
      <div style="font-size: 32px; color: #ffea00;" id="sc-total">0/0 (0.0 Overs)</div>
    </div>
    
    <table class="scorecard-table">
      <thead>
        <tr>
          <th>Batter</th>
          <th>Dismissal</th>
          <th>R</th>
          <th>B</th>
          <th>4s</th>
          <th>6s</th>
          <th>SR</th>
        </tr>
      </thead>
      <tbody id="scorecard-rows">
        <!-- Dynamically Populated Rows -->
      </tbody>
    </table>
  </div>

  <!-- ==========================================
       REAL-TIME DATA & ANIMATION CONTROLLER ENGINE
       ========================================== -->
  <script>
    // State Tracking Data Structure
    const overlayState = {
      team: "IND",
      runs: 0,
      wickets: 0,
      overs: "0.0",
      batsman1: { name: "BATSMAN 1", runs: 0, balls: 0, isStriker: true },
      batsman2: { name: "BATSMAN 2", runs: 0, balls: 0, isStriker: false },
      bowler: { name: "BOWLER", runs: 0, wickets: 0, overs: "0.0" }
    };

    let announcementTimer = null;
    let scorecardTimer = null;

    /* ------------------------------------------
       1. DATA RENDER ENGINE
       ------------------------------------------ */
    function renderOverlay(data) {
      if (!data) return;

      // Update basic details
      document.getElementById('team-name').innerText = data.team || "IND";
      document.getElementById('runs').innerText = data.runs ?? 0;
      document.getElementById('wickets').innerText = data.wickets ?? 0;
      document.getElementById('overs').innerText = data.overs || "0.0";

      // Update Batsmen details
      if (data.batsman1) {
        document.getElementById('batsman1-name').innerText = data.batsman1.name || "BAT1";
        document.getElementById('batsman1-runs').innerText = data.batsman1.runs ?? 0;
        document.getElementById('batsman1-balls').innerText = data.batsman1.balls ?? 0;
        
        const b1 = document.getElementById('batsman1-container');
        if (data.batsman1.isStriker) b1.classList.add('striker');
        else b1.classList.remove('striker');
      }

      if (data.batsman2) {
        document.getElementById('batsman2-name').innerText = data.batsman2.name || "BAT2";
        document.getElementById('batsman2-runs').innerText = data.batsman2.runs ?? 0;
        document.getElementById('batsman2-balls').innerText = data.batsman2.balls ?? 0;

        const b2 = document.getElementById('batsman2-container');
        if (data.batsman2.isStriker) b2.classList.add('striker');
        else b2.classList.remove('striker');
      }

      // Update Bowler details
      if (data.bowler) {
        document.getElementById('bowler-name').innerText = data.bowler.name || "BOWLER";
        document.getElementById('bowler-wickets').innerText = data.bowler.wickets ?? 0;
        document.getElementById('bowler-runs').innerText = data.bowler.runs ?? 0;
        document.getElementById('bowler-overs').innerText = data.bowler.overs || "0.0";
      }
    }

    /* ------------------------------------------
       2. DYNAMIC POPUP ANNOUNCEMENTS
       ------------------------------------------ */
    function triggerAnnouncement(type, text, subtitle = "") {
      const overlay = document.getElementById('announcement-overlay');
      const titleElem = document.getElementById('announcement-title');
      const subElem = document.getElementById('announcement-subtitle');

      // Clear existing active timers
      if (announcementTimer) clearTimeout(announcementTimer);

      // Reset classes
      overlay.className = '';
      
      // Configure announcement state
      titleElem.innerText = text;
      subElem.innerText = subtitle;

      if (type === 'WICKET') {
        overlay.classList.add('wicket');
      }

      // Show Popup with animation trigger
      overlay.classList.add('show');

      // Auto dismiss announcement popup after 3.5 seconds
      announcementTimer = setTimeout(() => {
        overlay.classList.remove('show');
      }, 3500);
    }

    /* ------------------------------------------
       3. FULL SCORECARD GRAPHIC SHOWCASE
       ------------------------------------------ */
    function triggerScorecard(playersData) {
      const scorecard = document.getElementById('full-scorecard');
      const rowsContainer = document.getElementById('scorecard-rows');
      
      if (scorecardTimer) clearTimeout(scorecardTimer);

      document.getElementById('sc-team-title').innerText = `${document.getElementById('team-name').innerText} INNINGS`;
      document.getElementById('sc-total').innerText = `${document.getElementById('runs').innerText}/${document.getElementById('wickets').innerText} (${document.getElementById('overs').innerText} Ov)`;

      // Populate table dynamically if data provided
      if (Array.isArray(playersData) && playersData.length > 0) {
        rowsContainer.innerHTML = playersData.map(p => `
          <tr>
            <td style="font-weight: 600;">${p.name}</td>
            <td style="color: #a0aec0;">${p.dismissal || 'not out'}</td>
            <td style="color: #00e5ff; font-weight: 700;">${p.runs}</td>
            <td>${p.balls}</td>
            <td>${p.fours || 0}</td>
            <td>${p.sixes || 0}</td>
            <td>${p.balls > 0 ? ((p.runs / p.balls) * 100).toFixed(1) : '0.0'}</td>
          </tr>
        `).join('');
      } else {
        // Fallback placeholder display using active state
        rowsContainer.innerHTML = `
          <tr>
            <td>${document.getElementById('batsman1-name').innerText}</td>
            <td style="color: #00e5ff;">batting</td>
            <td style="color: #00e5ff; font-weight: 700;">${document.getElementById('batsman1-runs').innerText}</td>
            <td>${document.getElementById('batsman1-balls').innerText}</td>
            <td>-</td>
            <td>-</td>
            <td>-</td>
          </tr>
          <tr>
            <td>${document.getElementById('batsman2-name').innerText}</td>
            <td style="color: #00e5ff;">batting</td>
            <td style="color: #00e5ff; font-weight: 700;">${document.getElementById('batsman2-runs').innerText}</td>
            <td>${document.getElementById('batsman2-balls').innerText}</td>
            <td>-</td>
            <td>-</td>
            <td>-</td>
          </tr>
        `;
      }

      // Show Full-Screen Scorecard overlay
      scorecard.classList.add('active');

      // Auto dismiss full scorecard after 6 seconds
      scorecardTimer = setTimeout(() => {
        scorecard.classList.remove('active');
      }, 6000);
    }

    /* ------------------------------------------
       4. LOCAL & EVENT STORAGE SYNC LISTENER
       ------------------------------------------ */
    window.addEventListener('storage', (e) => {
      if (e.key === 'cricket_overlay_data' && e.newValue) {
        const payload = JSON.parse(e.newValue);
        renderOverlay(payload);
      }

      if (e.key === 'cricket_event_trigger' && e.newValue) {
        const eventData = JSON.parse(e.newValue);
        
        switch (eventData.type) {
          case 'FOUR':
            triggerAnnouncement('FOUR', 'FOUR!', 'MAGNIFICENT SHOT');
            break;
          case 'SIX':
            triggerAnnouncement('SIX', 'SIX!', 'OUT OF THE PARK');
            break;
          case 'WICKET':
            triggerAnnouncement('WICKET', 'WICKET!', 'BIG BREAKTHROUGH');
            break;
          case 'MOTM':
            triggerAnnouncement('MOTM', 'MAN OF THE MATCH', eventData.player || '');
            break;
          case 'SHOW_SCORECARD':
            triggerScorecard(eventData.players);
            break;
          case 'TOGGLE_SCOREBAR':
            document.getElementById('scorebar').classList.toggle('active');
            break;
        }
      }
    });

    // Initial Load Check
    const initialData = localStorage.getItem('cricket_overlay_data');
    if (initialData) {
      renderOverlay(JSON.parse(initialData));
    }
  </script>
</body>
</html>
