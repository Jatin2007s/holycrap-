<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cricket Scorecard Overlay - Pulse Streaming</title>

  <!-- Firebase Compatibility SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
    }

    body {
      background: transparent;
      padding: 10px;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* FULL-SCREEN EVENT POPUP OVERLAY (SIX, FOUR, WICKET) */
    #popOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(6px);
    }

    .pop-card {
      padding: 30px 80px;
      border-radius: 20px;
      font-size: 7rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 6px;
      box-shadow: 0 0 60px rgba(0, 0, 0, 0.9);
      animation: popZoom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes popZoom {
      0% { transform: scale(0.2); opacity: 0; }
      60% { transform: scale(1.15); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    .pop-six { background: #0a0e17; color: #00e5ff; border: 8px solid #00e5ff; text-shadow: 0 0 35px #00e5ff; }
    .pop-four { background: #0a0e17; color: #facc15; border: 8px solid #facc15; text-shadow: 0 0 35px #facc15; }
    .pop-wicket { background: #0a0e17; color: #ff1744; border: 8px solid #ff1744; text-shadow: 0 0 35px #ff1744; }
    .pop-toss { background: #0a0e17; color: #ffd700; border: 8px solid #ffd700; font-size: 3rem; text-align: center; text-shadow: 0 0 30px #ffd700; }
    .pop-mom { background: #0a0e17; color: #ffd700; border: 8px solid #ffd700; font-size: 3rem; text-align: center; text-shadow: 0 0 35px #ffd700; }

    /* FULL PLAYER SCORECARD OVERLAY POPUP */
    #fullScorecardModal {
      display: none;
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 92vw; max-width: 950px;
      background: #0d131f;
      border: 3px solid #00e5ff;
      border-radius: 12px;
      padding: 24px;
      color: #fff;
      z-index: 10000;
      box-shadow: 0 0 50px rgba(0, 229, 255, 0.5);
    }

    .scorecard-header {
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 2px solid rgba(255, 255, 255, 0.15); padding-bottom: 12px; margin-bottom: 15px;
    }
    .scorecard-header h2 { color: #00e5ff; font-size: 1.8rem; text-transform: uppercase; font-weight: 900; }
    .scorecard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    
    .squad-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    .squad-table th { background: #1a2332; color: #ffd700; text-align: left; padding: 6px 8px; font-weight: 800; border-bottom: 2px solid #00e5ff; }
    .squad-table td { padding: 6px 8px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
    .squad-table tr:nth-child(even) { background: rgba(255, 255, 255, 0.03); }
    
    .status-badge { font-size: 0.75rem; padding: 2px 6px; border-radius: 4px; font-weight: bold; text-transform: uppercase; }
    .status-out { background: rgba(255, 23, 68, 0.2); color: #ff1744; border: 1px solid #ff1744; }
    .status-notout { background: rgba(46, 125, 50, 0.2); color: #4caf50; border: 1px solid #4caf50; }
    .status-yet { color: #888; }

    /* MAIN OVERLAY CARD */
    .overlay-card {
      width: 100%;
      max-width: 850px;
      background: #121927;
      border-radius: 8px;
      padding: 14px 20px;
      color: #ffffff;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      position: relative;
      overflow: hidden;
    }

    .card-bg-logo {
      position: absolute; right: -10px; bottom: -15px; height: 140%; width: auto;
      opacity: 0.12; pointer-events: none; z-index: 0;
      filter: drop-shadow(0 0 12px rgba(0, 229, 255, 0.4));
    }

    .top-bar, .bottom-bar { position: relative; z-index: 1; }

    .top-bar {
      display: flex; justify-content: space-between; align-items: center;
      padding-bottom: 8px; border-bottom: 1px solid rgba(255, 255, 255, 0.15);
    }

    .teams { font-size: 20px; font-weight: 800; color: #facc15; letter-spacing: 0.5px; }

    .score-container { display: flex; align-items: baseline; gap: 10px; }

    .score { font-size: 28px; font-weight: 900; color: #ffffff; }

    .target { font-size: 14px; color: #f87171; font-weight: bold; }

    .overs { font-size: 16px; font-weight: 600; color: #94a3b8; }

    .bottom-bar {
      display: flex; justify-content: space-between; align-items: center;
      padding-top: 8px; font-size: 14px;
    }

    .batsmen { color: #e2e8f0; }

    .highlight { color: #facc15; font-weight: bold; }

    .bowler-info { text-align: right; }

    .bowler { color: #facc15; font-weight: bold; }

    .this-over { color: #38bdf8; font-weight: bold; font-size: 13px; margin-top: 2px; }

    .event-anim {
      display: inline-block; padding: 2px 8px; border-radius: 4px;
      background: #facc15; color: #000; font-weight: 900; margin-left: 6px;
      animation: pop 0.4s ease-in-out;
    }

    /* MATCH FINISHED / WINNER CARD DISPLAY */
    .winner-card {
      display: none;
      text-align: center;
      padding: 18px;
      background: linear-gradient(135deg, #1b5e20, #2e7d32);
      border-radius: 8px;
      color: #ffd700;
      border: 2px solid #ffd700;
    }
    .winner-title { font-size: 1.8rem; font-weight: 900; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7); }
    .mom-title { font-size: 1.2rem; font-weight: 800; color: #ffffff; margin-top: 6px; }

    @keyframes pop {
      0% { transform: scale(0.7); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- FULL SCREEN EVENT POPUP (SIX, FOUR, WICKET, TOSS, MOM) -->
  <div id="popOverlay">
    <div id="popBox" class="pop-card pop-six">SIX!</div>
  </div>

  <!-- REAL FULL SCORECARD OVERLAY POPUP (5s) -->
  <div id="fullScorecardModal">
    <div class="scorecard-header">
      <h2 id="scTeams">TEAM A vs TEAM B</h2>
      <div style="font-size:1.4rem; font-weight:900; color:#ffd700;" id="scScore">0/0 (0.0 ov)</div>
    </div>
    <div class="scorecard-grid">
      <div>
        <h3 style="color:#00e5ff; margin-bottom:8px; font-size:1rem; border-bottom: 1px solid #1a2332; padding-bottom: 4px;">🏏 BATTING SCORECARD</h3>
        <table class="squad-table">
          <thead>
            <tr><th>Batsman</th><th>Status</th><th>R</th><th>B</th></tr>
          </thead>
          <tbody id="scBattingBody"></tbody>
        </table>
      </div>
      <div>
        <h3 style="color:#00e5ff; margin-bottom:8px; font-size:1rem; border-bottom: 1px solid #1a2332; padding-bottom: 4px;">🥎 BOWLING SCORECARD</h3>
        <table class="squad-table">
          <thead>
            <tr><th>Bowler</th><th>O</th><th>W</th><th>R</th></tr>
          </thead>
          <tbody id="scBowlingBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- SCORECARD OVERLAY CARD -->
  <div class="overlay-card" id="mainCard">
    <svg class="card-bg-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120">
      <defs>
        <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#FF1744" />
          <stop offset="100%" stop-color="#D50000" />
        </linearGradient>
      </defs>
      <g transform="translate(15, 10)">
        <circle cx="50" cy="50" r="38" fill="url(#bgGlow)" />
        <path d="M 28 28 C 38 40 38 60 28 72 M 72 28 C 62 40 62 60 72 72" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" />
        <path d="M 0 50 H 22 L 32 30 L 44 72 L 56 32 L 66 58 L 76 50 H 100" stroke="#00E5FF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      </g>
      <text x="125" y="62" font-family="sans-serif" font-weight="900" font-size="34" fill="#FFFFFF">PULSE</text>
      <text x="126" y="88" font-family="sans-serif" font-weight="700" font-size="16" fill="#00E5FF" letter-spacing="5">STREAMING</text>
    </svg>

    <!-- ACTIVE LIVE MATCH VIEW -->
    <div id="liveView">
      <div class="top-bar">
        <div class="teams" id="teams">TEAM A vs TEAM B</div>
        
        <div class="score-container">
          <div class="score"><span id="runs">0</span>/<span id="wickets">0</span></div>
          <div class="target" id="targetContainer" style="display:none;">(T: <span id="target">0</span>)</div>
        </div>

        <div class="overs">OVERS: <span id="overs">0.0</span> / <span id="maxOvers">20</span></div>
      </div>
      
      <div class="bottom-bar">
        <div class="batsmen">
          BAT: <span class="highlight" id="striker">Striker* 0 (0)</span> | <span id="nonStriker">Non-Striker 0 (0)</span>
        </div>
        
        <div class="bowler-info">
          <div>BOWL: <span class="bowler" id="bowler">Bowler 0-0 (0.0)</span></div>
          <div class="this-over">THIS OVER: [ <span id="thisOver">-</span> ] <span id="animBadge"></span></div>
        </div>
      </div>
    </div>

    <!-- MATCH OVER WINNER CARD -->
    <div class="winner-card" id="winnerView">
      <div class="winner-title" id="winnerText">🏆 TEAM A WON BY 5 WICKETS!</div>
      <div class="mom-title" id="momText"></div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      databaseURL: "https://betterone48-207a0-default-rtdb.asia-southeast1.firebasedatabase.app"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    const urlParams = new URLSearchParams(window.location.search);
    const matchId = urlParams.get('match') || 'match_1';

    let lastProcessedAnimId = 0;
    let scorecardTimeout = null;

    function renderFullScorecard(rawData) {
      const scModal = document.getElementById('fullScorecardModal');
      document.getElementById('scTeams').innerText = `${rawData.teamA} vs ${rawData.teamB}`;
      document.getElementById('scScore').innerText = `${rawData.runs || 0}/${rawData.wickets || 0} (${rawData.overs || '0.0'} ov)`;

      const squadA = rawData.squadA ? rawData.squadA.split(',').map(s => s.trim()) : [];
      const squadB = rawData.squadB ? rawData.squadB.split(',').map(s => s.trim()) : [];
      const stats = rawData.playerStats || {};

      let batHtml = '';
      squadA.forEach(p => {
        const pStat = stats[p] || { runs: 0, balls: 0, status: 'Yet to Bat' };
        let badge = '<span class="status-badge status-yet">YET TO BAT</span>';
        if (pStat.status === 'out') badge = '<span class="status-badge status-out">OUT</span>';
        if (pStat.status === 'not out' || pStat.status === 'Batting') badge = '<span class="status-badge status-notout">NOT OUT</span>';

        batHtml += `<tr><td><strong>${p}</strong></td><td>${badge}</td><td><strong>${pStat.runs || 0}</strong></td><td>${pStat.balls || 0}</td></tr>`;
      });
      document.getElementById('scBattingBody').innerHTML = batHtml;

      let bowlHtml = '';
      squadB.forEach(p => {
        const pStat = stats[p] || { overs: '0.0', wickets: 0, conceded: 0 };
        bowlHtml += `<tr><td><strong>${p}</strong></td><td>${pStat.overs || '0.0'}</td><td><strong style="color:#ff1744;">${pStat.wickets || 0}</strong></td><td>${pStat.conceded || 0}</td></tr>`;
      });
      document.getElementById('scBowlingBody').innerHTML = bowlHtml;

      scModal.style.display = 'block';

      if (scorecardTimeout) clearTimeout(scorecardTimeout);
      scorecardTimeout = setTimeout(() => {
        scModal.style.display = 'none';
      }, 5000);
    }

    function triggerFullScreenEvent(eventType, extraData = "", rawData = null) {
      const overlay = document.getElementById('popOverlay');
      const box = document.getElementById('popBox');

      if (eventType === 'FULL_SCORECARD' && rawData && !rawData.isMatchOver) {
        renderFullScorecard(rawData);
        return;
      }

      if (!overlay || !box) return;

      if (eventType === 'SIX') {
        box.innerText = '💥 SIX! 💥';
        box.className = 'pop-card pop-six';
      } else if (eventType === 'FOUR') {
        box.innerText = '⚡ FOUR! ⚡';
        box.className = 'pop-card pop-four';
      } else if (eventType === 'WICKET') {
        box.innerText = '☝️ WICKET! ☝️';
        box.className = 'pop-card pop-wicket';
      } else if (eventType === 'TOSS_FLIP') {
        box.innerText = '🪙 FLIPPING TOSS COIN...';
        box.className = 'pop-card pop-toss';
      } else if (eventType === 'TOSS_RESULT') {
        box.innerText = `🪙 ${extraData.toUpperCase()}`;
        box.className = 'pop-card pop-toss';
      } else if (eventType === 'MAN_OF_THE_MATCH') {
        box.innerText = `🏅 MAN OF THE MATCH\n${extraData.toUpperCase()}`;
        box.className = 'pop-card pop-mom';
      } else {
        return;
      }

      overlay.style.display = 'flex';
      setTimeout(() => {
        overlay.style.display = 'none';
      }, eventType.includes('TOSS') || eventType === 'MAN_OF_THE_MATCH' ? 4000 : 2500);
    }

    firebase.database().ref('matches/' + matchId).on('value', (snapshot) => {
      const data = snapshot.val();
      if (!data) return;

      const liveView = document.getElementById('liveView');
      const winnerView = document.getElementById('winnerView');

      if (data.isMatchOver && data.matchStatusText) {
        document.getElementById('fullScorecardModal').style.display = 'none';
        liveView.style.display = 'none';
        winnerView.style.display = 'block';
        document.getElementById('winnerText').innerText = data.matchStatusText;
        if (data.manOfTheMatch) {
          document.getElementById('momText').innerText = `🏅 MAN OF THE MATCH: ${data.manOfTheMatch.toUpperCase()}`;
        } else {
          document.getElementById('momText').innerText = '';
        }
        return;
      } else {
        liveView.style.display = 'block';
        winnerView.style.display = 'none';
      }

      if (data.teamA && data.teamB) {
        document.getElementById('teams').innerText = `${data.teamA} vs ${data.teamB}`;
      }

      document.getElementById('runs').innerText = data.runs !== undefined ? data.runs : 0;
      document.getElementById('wickets').innerText = data.wickets !== undefined ? data.wickets : 0;
      document.getElementById('overs').innerText = data.overs !== undefined ? data.overs : '0.0';
      document.getElementById('maxOvers').innerText = data.maxOvers || 20;

      if (data.target) {
        document.getElementById('targetContainer').style.display = 'inline';
        document.getElementById('target').innerText = data.target;
      } else {
        document.getElementById('targetContainer').style.display = 'none';
      }

      const sName = data.strikerName || 'Striker';
      const sRuns = data.strikerRuns !== undefined ? data.strikerRuns : 0;
      const sBalls = data.strikerBalls !== undefined ? data.strikerBalls : 0;
      document.getElementById('striker').innerText = `${sName}* ${sRuns} (${sBalls})`;

      const nsName = data.nonStrikerName || 'Non-Striker';
      const nsRuns = data.nonStrikerRuns !== undefined ? data.nonStrikerRuns : 0;
      const nsBalls = data.nonStrikerBalls !== undefined ? data.nonStrikerBalls : 0;
      document.getElementById('nonStriker').innerText = `${nsName} ${nsRuns} (${nsBalls})`;

      const bName = data.bowler || data.bowlerName || 'Bowler';
      const bWickets = data.bowlerWickets !== undefined ? data.bowlerWickets : 0;
      const bRuns = data.bowlerRuns !== undefined ? data.bowlerRuns : 0;
      const bOvers = data.bowlerOvers !== undefined ? data.bowlerOvers : '0.0';
      document.getElementById('bowler').innerText = `${bName} ${bWickets}-${bRuns} (${bOvers})`;

      document.getElementById('thisOver').innerText = data.thisOver || '-';
      
      const badge = document.getElementById('animBadge');
      if (data.lastEvent && !data.lastEvent.includes('TOSS') && data.lastEvent !== 'MAN_OF_THE_MATCH' && data.lastEvent !== 'FULL_SCORECARD') {
        badge.innerHTML = `<span class="event-anim">${data.lastEvent}</span>`;
      } else {
        badge.innerHTML = '';
      }

      if (data.lastEvent && data.animId && data.animId !== lastProcessedAnimId) {
        lastProcessedAnimId = data.animId;
        const extraPayload = data.lastEvent === 'MAN_OF_THE_MATCH' ? data.manOfTheMatch : data.tossText;
        triggerFullScreenEvent(data.lastEvent, extraPayload, data);
      }
    });
  </script>

</body>
</html>
