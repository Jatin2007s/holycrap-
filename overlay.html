<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cricket Stream Overlay</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background: transparent;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
      overflow: hidden;
    }

    /* Center-Screen Scorecard Modal */
    #scorecardModal {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      width: 85%;
      max-width: 750px;
      background: rgba(18, 18, 18, 0.95);
      border: 3px solid #ff4757;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.9), 0 0 20px rgba(255, 71, 87, 0.3);
      opacity: 0;
      pointer-events: none;
      transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* Pop-up Trigger State */
    #scorecardModal.show {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
      pointer-events: auto;
    }

    h2 {
      margin: 0 0 12px 0;
      color: #ff4757;
      font-size: 20px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      border-bottom: 2px solid #333;
      padding-bottom: 6px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
    }

    th, td {
      padding: 10px 14px;
      text-align: left;
      font-size: 16px;
    }

    th {
      background: #2e2e2e;
      color: #ff4757;
      font-weight: bold;
      text-transform: uppercase;
    }

    tr:nth-child(even) { background: rgba(255, 255, 255, 0.05); }
    .status-out { color: #ff4757; font-weight: bold; }
    .status-batting { color: #2ed573; font-weight: bold; }
  </style>
</head>
<body>

  <div id="scorecardModal">
    <h2>Batting</h2>
    <table id="battingTable">
      <thead>
        <tr><th>Batter</th><th>Status</th><th>R</th><th>B</th></tr>
      </thead>
      <tbody></tbody>
    </table>

    <h2>Bowling</h2>
    <table id="bowlingTable">
      <thead>
        <tr><th>Bowler</th><th>O</th><th>W</th><th>R</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
    let matchState = {};

    function loadAndRender() {
      const saved = localStorage.getItem("cricketMatchData");
      if (saved) {
        matchState = JSON.parse(saved);
      }
    }

    function renderTables() {
      const batTbody = document.querySelector("#battingTable tbody");
      const bowlTbody = document.querySelector("#bowlingTable tbody");
      
      batTbody.innerHTML = "";
      bowlTbody.innerHTML = "";

      if (!matchState.batters) return;

      // Filter: Only players who have batted or are currently batting
      const activeBatters = matchState.batters.filter(b => b.status === "batting" || b.status === "out");
      
      if (activeBatters.length === 0) {
        batTbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:#aaa;">No batting data yet</td></tr>`;
      } else {
        activeBatters.forEach(b => {
          const statusClass = b.status === "out" ? "status-out" : "status-batting";
          const statusText = b.status === "out" ? "OUT" : "NOT OUT";
          batTbody.innerHTML += `
            <tr>
              <td>${b.name}</td>
              <td class="${statusClass}">${statusText}</td>
              <td>${b.runs}</td>
              <td>${b.balls}</td>
            </tr>
          `;
        });
      }

      // Filter: Only bowlers who have bowled at least 1 ball or 1 over
      const activeBowlers = matchState.bowlers.filter(b => b.overs > 0 || b.balls > 0);
      
      if (activeBowlers.length === 0) {
        bowlTbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:#aaa;">No bowling data yet</td></tr>`;
      } else {
        activeBowlers.forEach(b => {
          bowlTbody.innerHTML += `
            <tr>
              <td>${b.name}</td>
              <td>${b.overs}.${b.balls}</td>
              <td>${b.wickets}</td>
              <td>${b.runs}</td>
            </tr>
          `;
        });
      }
    }

    function triggerFullScorecard() {
      loadAndRender();
      renderTables();

      const modal = document.getElementById("scorecardModal");
      
      modal.classList.add("show");

      setTimeout(() => {
        modal.classList.remove("show");
      }, 5000);
    }

    // Auto update when data changes or animation trigger is hit
    window.addEventListener("storage", (e) => {
      loadAndRender();
      if (e.key === "triggerScorecardAnimation") {
        triggerFullScorecard();
      }
    });

    window.addEventListener("message", (event) => {
      if (event.data === "SHOW_SCORECARD") {
        triggerFullScorecard();
      }
    });

    loadAndRender();
  </script>
</body>
</html>
