<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cricket Scorecard Broadcast Overlay (Animated)</title>
  <style>
    :root {
      --bg-panel: #111827;
      --text-main: #ffffff;
      --accent-yellow: #facc15;
      --btn-blue: #2563eb;
      --btn-green: #16a34a;
      --btn-purple: #9333ea;
      --btn-red: #dc2626;
      --btn-gray: #4b5563;
      --four-color: #4ade80;  /* Vibrant green for 4 */
      --six-color: #a78bfa;   /* Vibrant purple for 6 */
      --wicket-color: #f87171;/* Flash red for Wicket */
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0b0f19;
      color: var(--text-main);
    }

    body.overlay-mode {
      background-color: transparent !important;
    }

    /* CONTROL PANEL */
    .admin-panel {
      max-width: 650px;
      margin: 20px auto;
      padding: 20px;
      background: var(--bg-panel);
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .admin-panel h2 {
      margin-top: 0;
      text-align: center;
      color: var(--accent-yellow);
    }

    .section-title {
      font-size: 13px;
      color: #9ca3af;
      margin: 15px 0 6px 0;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .input-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    input {
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #374151;
      background: #1f2937;
      color: #fff;
      font-size: 14px;
      width: 100%;
      box-sizing: border-box;
    }

    .grid-buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .manual-controls {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    button {
      padding: 12px;
      font-size: 15px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      color: #fff;
      background: var(--btn-blue);
      transition: transform 0.1s;
    }

    button:active {
      transform: scale(0.95);
    }

    .btn-dot { background: var(--btn-gray); }
    .btn-four { background: var(--btn-green); }
    .btn-six { background: var(--btn-purple); }
    .btn-wicket { background: var(--btn-red); }
    .btn-extra { background: #d97706; }
    .btn-manual { background: #374151; border: 1px solid #4b5563; }
    .btn-toggle { background: #0891b2; grid-column: span 3; margin-top: 15px; width: 100%; }

    /* BROADCAST OVERLAY SCOREBAR */
    .scorebar-container {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 900px;
      background: rgba(15, 23, 42, 0.95);
      border-left: 5px solid var(--accent-yellow);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      padding: 10px 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.8);
      z-index: 9999;
      transition: border-color 0.3s, background-color 0.3s;
    }

    .main-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      padding-bottom: 6px;
    }

    .sub-row {
      display: flex;
      justify-content: space-between;
      padding-top: 6px;
      font-size: 14px;
      color: #d1d5db;
    }

    .team-info {
      font-size: 20px;
      font-weight: 800;
      color: var(--accent-yellow);
    }

    .score-info {
      font-size: 28px;
      font-weight: 900;
    }

    .overs-info {
      font-size: 18px;
      color: #9ca3af;
      font-weight: 600;
    }

    .player-highlight {
      color: var(--accent-yellow);
      font-weight: bold;
    }

    body.overlay-mode .hide-on-overlay {
      display: none !important;
    }

    /* --- ANIMATION STYLES --- */
    @keyframes pulse-animation {
      0% { transform: translateX(-50%) scale(1); }
      50% { transform: translateX(-50%) scale(1.06); }
      100% { transform: translateX(-50%) scale(1); }
    }

    /* FOUR Animation */
    .scorebar-container.animate-four {
      animation: pulse-animation 0.5s ease-in-out;
      border-left-color: var(--four-color);
      background-color: rgba(22, 163, 74, 0.9);
    }

    /* SIX Animation */
    .scorebar-container.animate-six {
      animation: pulse-animation 0.5s ease-in-out;
      border-left-color: var(--six-color);
      background-color: rgba(147, 51, 234, 0.9);
    }

    /* WICKET Animation */
    .scorebar-container.animate-wicket {
      animation: pulse-animation 0.6s ease-in-out;
      border-left-color: var(--wicket-color);
      background-color: rgba(220, 38, 38, 0.95);
    }
  </style>
</head>
<body>

  <!-- CONTROL PANEL -->
  <div class="admin-panel hide-on-overlay">
    <h2>🏏 Match Setup & Control (Animated)</h2>

    <div class="section-title">📝 Teams & Players</div>
    <div class="input-grid">
      <input type="text" id="in-team-a" placeholder="Team A Name" value="TEAM A" oninput="updateNames()">
      <input type="text" id="in-team-b" placeholder="Team B Name" value="TEAM B" oninput="updateNames()">
      <input type="text" id="in-striker" placeholder="Striker Batsman (*)" value="Striker*" oninput="updateNames()">
      <input type="text" id="in-non-striker" placeholder="Non-Striker" value="Non-Striker" oninput="updateNames()">
      <input type="text" id="in-bowler" placeholder="Current Bowler" value="Bowler Name" oninput="updateNames()" style="grid-column: span 2;">
    </div>
    
    <div class="section-title">⚡ Quick Actions (Auto +1 Ball)</div>
    <div class="grid-buttons">
      <button class="btn-dot" onclick="addBall(0)">0 (Dot Ball)</button>
      <button onclick="addBall(1)">+1 Run</button>
      <button onclick="addBall(2)">+2 Runs</button>
      <button onclick="addBall(3)">+3 Runs</button>
      <button class="btn-four" onclick="triggerAnimation('four'); addBall(4);">4️⃣ FOUR</button>
      <button class="btn-six" onclick="triggerAnimation('six'); addBall(6);">6️⃣ SIX</button>
      <button class="btn-wicket" onclick="addWicket()">☝️ WICKET</button>
      <button class="btn-extra" onclick="addExtra()">Wide (+1 Run)</button>
      <button class="btn-extra" onclick="addExtra()">No Ball (+1 Run)</button>
    </div>

    <div class="section-title">🛠️ Manual Adjustments</div>
    <div class="manual-controls">
      <button class="btn-manual" onclick="manualAdjust('runs', 1)">+1 Run</button>
      <button class="btn-manual" onclick="manualAdjust('runs', -1)">-1 Run</button>
      <button class="btn-manual" onclick="manualAdjust('balls', 1)">+1 Ball</button>
      <button class="btn-manual" onclick="manualAdjust('balls', -1)">-1 Ball</button>
      <button class="btn-manual" onclick="manualAdjust('wickets', 1)">+1 Wicket</button>
      <button class="btn-manual" onclick="manualAdjust('wickets', -1)">-1 Wicket</button>
    </div>

    <button class="btn-toggle" onclick="toggleOverlayMode()">🎥 Switch to OBS / PRISM Overlay</button>
  </div>

  <!-- BROADCAST SCOREBAR -->
  <div class="scorebar-container" id="scorebar">
    <div class="main-row">
      <div class="team-info"><span id="out-team-a">TEAM A</span> vs <span id="out-team-b">TEAM B</span></div>
      <div class="score-info">
        <span id="runs">0</span>/<span id="wickets">0</span>
      </div>
      <div class="overs-info">
        OVERS: <span id="overs">0.0</span>
      </div>
    </div>
    <div class="sub-row">
      <div>BAT: <span class="player-highlight" id="out-striker">Striker*</span> | <span id="out-non-striker">Non-Striker</span></div>
      <div>BOWL: <span class="player-highlight" id="out-bowler">Bowler Name</span></div>
    </div>
  </div>

  <script>
    let runs = 0;
    let wickets = 0;
    let legalBalls = 0;
    const scorebar = document.getElementById('scorebar');

    function updateNames() {
      document.getElementById('out-team-a').innerText = document.getElementById('in-team-a').value || 'TEAM A';
      document.getElementById('out-team-b').innerText = document.getElementById('in-team-b').value || 'TEAM B';
      document.getElementById('out-striker').innerText = document.getElementById('in-striker').value || 'Striker*';
      document.getElementById('out-non-striker').innerText = document.getElementById('in-non-striker').value || 'Non-Striker';
      document.getElementById('out-bowler').innerText = document.getElementById('in-bowler').value || 'Bowler Name';
    }

    function updateDisplay() {
      const overNum = Math.floor(legalBalls / 6);
      const ballNum = legalBalls % 6;
      
      document.getElementById('runs').innerText = runs;
      document.getElementById('wickets').innerText = wickets;
      document.getElementById('overs').innerText = `${overNum}.${ballNum}`;
    }

    function triggerAnimation(type) {
      const animClass = `animate-${type}`;
      scorebar.classList.add(animClass);
      setTimeout(() => {
        scorebar.classList.remove(animClass);
      }, 600);
    }

    function addBall(r) {
      runs += r;
      legalBalls++;
      updateDisplay();
    }

    function addWicket() {
      if (wickets < 10) {
        triggerAnimation('wicket');
        wickets++;
        legalBalls++;
        updateDisplay();
      }
    }

    function addExtra() {
      runs += 1;
      updateDisplay();
    }

    function manualAdjust(type, amount) {
      if (type === 'runs') runs = Math.max(0, runs + amount);
      if (type === 'wickets') wickets = Math.min(10, Math.max(0, wickets + amount));
      if (type === 'balls') legalBalls = Math.max(0, legalBalls + amount);
      updateDisplay();
    }

    function toggleOverlayMode() {
      document.body.classList.toggle('overlay-mode');
    }
  </script>
</body>
</html>
